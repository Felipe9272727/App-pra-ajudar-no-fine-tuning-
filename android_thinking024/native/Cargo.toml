[package]
name = "liquid-sense-mobile"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"

[lib]
name = "liquid_sense"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
libc = "0.2"
memmap2 = "0.9"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
jni = "0.21"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"
