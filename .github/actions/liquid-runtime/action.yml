name: liquid sense CPU runtime
description: Pinned CPU packages and one shared cache of the pinned model assets.
inputs:
  model-assets:
    default: 'true'
    description: Restore the model files needed for inference.
  prepare-assets:
    default: 'false'
    description: Allow the initial job to create the shared model cache.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements-ci.txt
    - name: Install pinned CPU runtime
      shell: bash
      run: |
        python -m pip install torch==2.15.0+cpu --index-url https://download.pytorch.org/whl/cpu
        python -m pip install -r requirements-ci.txt
    - name: Restore pinned model assets
      if: inputs.model-assets == 'true'
      id: assets
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          upstream
          sensenova_port
        key: liquid-sense-assets-v1-${{ hashFiles('hf_model_info.json', 'sensenova_config.json', 'build_sensenova_port.py', 'modeling_sensenova_loop.py') }}
    - name: Prepare exact model assets
      if: inputs.model-assets == 'true' && steps.assets.outputs.cache-hit != 'true'
      shell: bash
      env:
        ALLOW_PREPARE: ${{ inputs.prepare-assets }}
      run: |
        if [ "$ALLOW_PREPARE" != true ]; then
          echo 'The prepare job must create the shared model cache first.'
          exit 1
        fi
        python download_model.py
        python build_sensenova_port.py
    - name: Save shared model cache
      if: inputs.model-assets == 'true' && inputs.prepare-assets == 'true' && steps.assets.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          upstream
          sensenova_port
        key: liquid-sense-assets-v1-${{ hashFiles('hf_model_info.json', 'sensenova_config.json', 'build_sensenova_port.py', 'modeling_sensenova_loop.py') }}
