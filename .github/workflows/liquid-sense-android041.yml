name: Liquid Sense Android speed update 041
on:
  push:
    branches: [codex/liquid-sense-speed-041-20261121]
    paths: [speed041/android_request.json]
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_AVD_HOME: /home/runner/.android/avd
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: liquid-sense-0.6.5-speed041
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: speed041
      - name: Reconstruct and verify both installers and the existing app
        run: |
          mkdir -p "$RUNNER_TEMP/speed041" "$RUNNER_TEMP/evidence041"
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, urllib.request, zipfile
          path=Path(os.environ['RUNNER_TEMP'])/'speed041'
          m=json.loads(Path('speed041/reports/updater_manifest.json').read_text())
          assets=sorted(Path('speed041/artifacts').glob('updater*.bin'))
          assert assets
          data=b''.join(x.read_bytes() for x in assets)
          assert len(data)==m['updater']['bytes'] and hashlib.sha256(data).hexdigest()==m['updater']['sha256']
          (path/m['updater']['name']).write_bytes(data)
          for name in ('smoke_updater','smoke_chat'):
              data=(Path('speed041/tests')/(name+'.apk.bin')).read_bytes()
              assert hashlib.sha256(data).hexdigest()==m[name]['sha256']
              (path/(name+'.apk')).write_bytes(data)
          root='https://github.com/'+os.environ['GH_REPO']+'/releases/download/'
          archive=path/'source.zip'
          urllib.request.urlretrieve(root+'liquid-sense-0.6.3-verified035/LiquidSense-0.6.3-verificado.zip',archive)
          with archive.open('rb') as f: assert hashlib.file_digest(f,'sha256').hexdigest()=='52966dccfc9ec1dd6f4eaeabadaa3615c31e286034d84c04a74690042724f307'
          with zipfile.ZipFile(archive) as z: z.extract('LiquidSense-0.6.3-install-preview.apk',path)
          archive.unlink()
          urllib.request.urlretrieve(root+'liquid-sense-0.6.4-gpu040/LiquidSense-Atualizador-GPU-0.4.apk',path/'previous-updater.apk')
          PY
          data="$RUNNER_TEMP/speed041"
          python speed041/recover_064.py "$data/LiquidSense-0.6.3-install-preview.apk" "$data/previous-updater.apk" "$data/LiquidSense-0.6.4-gpu-preview.apk"
          rm -- "$data/LiquidSense-0.6.3-install-preview.apk"
      - name: Start Android 15
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/local/lib/android/sdk/ndk
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'emulator' 'platform-tools' 'system-images;android-35;google_apis;x86_64'
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name liquid041 --path "$ANDROID_AVD_HOME/liquid041.avd" --package 'system-images;android-35;google_apis;x86_64' --device pixel_6
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-35\n' "$ANDROID_AVD_HOME/liquid041.avd" > "$ANDROID_AVD_HOME/liquid041.ini"
          "$ANDROID_HOME/emulator/emulator" -avd liquid041 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 4096 -cores 2 -partition-size 12288 > "$RUNNER_TEMP/evidence041/emulator.log" 2>&1 &
          emulator_pid=$!
          sleep 5
          kill -0 "$emulator_pid"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Update the signed app and keep its history
        run: |
          timeout 120s adb wait-for-device
          for n in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          data="$RUNNER_TEMP/speed041"
          adb install --no-incremental "$data/LiquidSense-0.6.4-gpu-preview.apk"
          adb install --no-incremental "$data/previous-updater.apk"
          adb install -r --no-incremental "$data/LiquidSense-Atualizador-0.5.apk"
          adb install --no-incremental "$data/smoke_updater.apk"
          adb install --no-incremental "$data/smoke_chat.apk"
          for pkg in dev.liquidsense.installcheck dev.liquidsense.installcheck.smoke; do
            adb shell appops set "$pkg" REQUEST_INSTALL_PACKAGES allow
            adb shell appops set --uid "$pkg" REQUEST_INSTALL_PACKAGES allow
          done
          adb root
          adb wait-for-device
          app_uid=$(adb shell cmd package list packages -U dev.liquidsense.chat.tools | sed -n 's/^package:dev.liquidsense.chat.tools uid:\([0-9]*\).*/\1/p' | tr -d '\r')
          test -n "$app_uid"
          cat > "$data/MainActivity.xml" <<'XML'
          <?xml version='1.0' encoding='utf-8' standalone='yes' ?>
          <map><string name="ci_update_marker">retained</string><string name="selected_model_v022">base</string><string name="conversation_base">[{&quot;role&quot;:&quot;user&quot;,&quot;content&quot;:&quot;Marcador local antes da atualização&quot;}]</string></map>
          XML
          prefs=/data/user/0/dev.liquidsense.chat.tools/shared_prefs
          adb shell mkdir -p "$prefs"
          activity_prefs="$prefs/dev.liquidsense.chat.MainActivity.xml"
          adb push "$data/MainActivity.xml" "$activity_prefs"
          adb shell chown -R "$app_uid:$app_uid" "$prefs"
          adb shell chmod 700 "$prefs"
          adb shell chmod 600 "$activity_prefs"
          adb shell restorecon -R "$prefs"
          adb shell am instrument -w dev.liquidsense.installcheck.smoke/dev.liquidsense.installcheck.Smoke | tee "$RUNNER_TEMP/evidence041/update.txt"
          grep -q 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/evidence041/update.txt"
          grep -q 'Status: 0' "$RUNNER_TEMP/evidence041/update.txt"
      - name: Verify real local generation and GPU-mode identity
        run: |
          adb shell am instrument -w dev.liquidsense.chat.tools.smoke/dev.liquidsense.chat.SmokeSpeed | tee "$RUNNER_TEMP/evidence041/chat.txt"
          grep -q 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/evidence041/chat.txt"
      - name: Publish and verify the compact updater
        run: |
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/speed041/LiquidSense-Atualizador-0.5.apk"
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          python - <<'PY'
          from pathlib import Path
          import urllib.request,json,hashlib,os
          m=json.loads(Path('speed041/reports/updater_manifest.json').read_text())['updater']
          url=f"https://github.com/{os.environ['GH_REPO']}/releases/download/{os.environ['RELEASE_TAG']}/{m['name']}"
          with urllib.request.urlopen(url,timeout=45) as r: data=r.read()
          assert len(data)==m['bytes'] and hashlib.sha256(data).hexdigest()==m['sha256']
          (Path(os.environ['RUNNER_TEMP'])/'evidence041/delivery.json').write_text(json.dumps({**m,'url':url,'public_download_verified':True},indent=2)+'\n')
          PY
      - name: Collect Android diagnostics
        if: always()
        run: adb logcat -d -t 800 > "$RUNNER_TEMP/evidence041/logcat.txt" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: speed041-android-evidence
          path: ${{ runner.temp }}/evidence041
          retention-days: 14
