name: liquid sense - RSI cycle 2 direct weight updates

on:
  workflow_dispatch:
  push:
    branches: [codex/liquid-sense-rsi-cycle2-20261104]
    paths:
      - .github/workflows/liquid-sense-rsi-cycle2.yml
      - lab_rsi/ci_run_request.json

permissions:
  contents: read

concurrency:
  group: liquid-sense-rsi2-${{ github.ref }}
  cancel-in-progress: true

env:
  LS_CPU_THREADS: '4'
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
  PYTHONUNBUFFERED: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'

jobs:
  prepare:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify saved checkpoints and partition checks
        run: |
          sha256sum --check lab_rsi/SHA256SUMS
          python -m unittest discover -s tests -v
      - uses: ./.github/actions/liquid-runtime
        with:
          prepare-assets: 'true'
      - name: Verify canonical upstream weights
        run: echo '04b1c301231dd422b8860db31311ab2721511346a32cb1e079c4c4e5f1fe4696  upstream/model.safetensors-00001-of-00001.safetensors' | sha256sum --check

  development:
    needs: prepare
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      variants: ${{ steps.matrix.outputs.variants }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/liquid-sense-rsi-cycle2-20261104
          fetch-depth: 0
      - name: Guard against concurrent source changes
        run: python lab_rsi/publish_progress.py guard
      - uses: ./.github/actions/liquid-runtime
      - name: Run three iterative edits and save each checkpoint
        run: python lab_rsi/ci.py develop
      - id: matrix
        run: echo "variants=$(python lab_rsi/ci.py validation-matrix)" >> "$GITHUB_OUTPUT"
      - name: Save development checkpoint even after failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: liquid-development
          path: ci_output/development/
          retention-days: 3
          if-no-files-found: warn

  validation:
    needs: development
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        variant: ${{ fromJSON(needs.development.outputs.variants) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/liquid-runtime
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: liquid-development
          path: .
      - name: Generate validation answers with the complete active model
        env:
          VARIANT: ${{ matrix.variant }}
        run: python lab_rsi/ci.py validate --variant "$VARIANT"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: liquid-validation-${{ matrix.variant }}
          path: ci_output/validation-${{ matrix.variant }}/
          retention-days: 3
          if-no-files-found: warn

  freeze:
    needs: [development, validation]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      variants: ${{ steps.matrix.outputs.variants }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/liquid-sense-rsi-cycle2-20261104
          fetch-depth: 0
      - name: Guard against concurrent source changes
        run: python lab_rsi/publish_progress.py guard
      - uses: ./.github/actions/liquid-runtime
        with:
          model-assets: 'false'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: liquid-*
          merge-multiple: true
          path: .
      - name: Freeze selection before any final-test answer
        run: python lab_rsi/ci.py freeze
      - id: matrix
        run: echo "variants=$(python lab_rsi/ci.py final-matrix)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: liquid-frozen
          path: ci_output/frozen/
          retention-days: 3
          if-no-files-found: error

  heldout:
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        variant: ${{ fromJSON(needs.freeze.outputs.variants) }}
        shard: [0, 1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/liquid-runtime
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: liquid-frozen
          path: .
      - name: Evaluate independent fresh-test partition
        env:
          VARIANT: ${{ matrix.variant }}
          SHARD: ${{ matrix.shard }}
        run: python lab_rsi/ci.py heldout --variant "$VARIANT" --shard "$SHARD"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: liquid-heldout-${{ matrix.variant }}-${{ matrix.shard }}
          path: ci_output/heldout-${{ matrix.variant }}-${{ matrix.shard }}/
          retention-days: 3
          if-no-files-found: warn

  report:
    needs: heldout
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/liquid-runtime
        with:
          model-assets: 'false'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: liquid-*
          merge-multiple: true
          path: .
      - name: Restore frozen selection after merging the disjoint evaluation results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: liquid-frozen
          path: .
      - name: Verify complete partitions and write the actual results
        run: python lab_rsi/ci.py aggregate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: liquid-final-report
          path: ci_output/final/
          retention-days: 3
          if-no-files-found: error
      - name: Show report in Actions summary
        run: cat LAB_REPORT.md >> "$GITHUB_STEP_SUMMARY"

  save:
    needs: report
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/liquid-sense-rsi-cycle2-20261104
          fetch-depth: 0
      - name: Check that source has not changed during evaluation
        run: python lab_rsi/publish_progress.py guard
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: liquid-final-report
          path: .
      - name: Save complete results and final reconstruction manifest
        run: python lab_rsi/publish_progress.py 'complete final test and checkpoint'
