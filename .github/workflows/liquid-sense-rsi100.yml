name: liquid sense - 100 forward-only weight-search rounds
'on':
  workflow_dispatch: null
  push:
    branches:
    - codex/liquid-sense-rsi100-20261104
    paths:
    - .github/workflows/liquid-sense-rsi100.yml
    - rsi100/run_request.json
permissions:
  contents: read
concurrency:
  group: rsi100-${{ github.ref }}
  cancel-in-progress: true
env:
  LS_CPU_THREADS: '4'
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
  PYTHONUNBUFFERED: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  CODE_IMAGE: python@sha256:b18b261e1b4974b4f321451ad5251ded85abb22c2b8b262da527dda1d031ab30
jobs:
  wait_prior:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Wait for previous evaluation to avoid exceeding four machines
      env:
        GH_TOKEN: ${{ github.token }}
      run: python rsi100/wait_prior.py
  prepare:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Check data, source syntax and protocol rules
      run: |-
        sha256sum --check rsi100/SHA256SUMS
        python -m compileall -q rsi100 code_rsi
        python -m unittest discover -s tests -v
    - uses: ./.github/actions/liquid-runtime
      with:
        model-assets: 'true'
        prepare-assets: 'true'
    - name: Verify 2/3/4 visits and independent recurrent/KV caches on the actual tiny runtime
      run: python code_rsi/smoke_loops.py
    - name: Check all mutation families, seed replay and clean-directory saves
      run: python rsi100/smoke.py
    - name: Verify original canonical weights
      run: echo '04b1c301231dd422b8860db31311ab2721511346a32cb1e079c4c4e5f1fe4696  upstream/model.safetensors-00001-of-00001.safetensors'
        | sha256sum --check
    - name: Check isolated execution with the pinned Python image
      run: |-
        docker pull "$CODE_IMAGE"
        python - <<'SMOKE'
        import sys
        sys.path.insert(0,'code_rsi')
        from sandbox import evaluate
        r=evaluate('def solve(xs): return sum(xs)', {'cases':[{'args':[[2,3]],'expected':5}]})
        assert r['all_passed'] and r['case_passed']==[True],r
        print('RSI100_ISOLATED_EXECUTION_OK')
        SMOKE
    needs: wait_prior
  rounds_001_010:
    needs:
    - prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: codex/liquid-sense-rsi100-20261104
        fetch-depth: 0
    - name: Check immutable source and checkpoint owner
      run: python rsi100/publish.py guard
    - uses: ./.github/actions/liquid-runtime
      with:
        model-assets: 'true'
    - name: Attempt rounds 1-10; discard regressions and restore incumbent
      run: python rsi100/engine.py chunk --start 1 --stop 10
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: rsi100-chunk-10
        path: rsi100_output/chunk-10/
        retention-days: 3
        if-no-files-found: warn
      if: always()
    permissions:
      contents: write
  rounds_011_020:
    needs:
    - prepare
    - rounds_001_010
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
