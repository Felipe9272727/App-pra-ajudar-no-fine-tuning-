  freeze:
    needs:
    - prepare
    - rounds_091_100
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: codex/liquid-sense-rsi100-20261104
        fetch-depth: 0
    - name: Check immutable source and checkpoint owner
      run: python rsi100/publish.py guard
    - uses: ./.github/actions/liquid-runtime
      with:
        model-assets: 'true'
    - name: Evaluate fresh transfer gate once and freeze final choice
      run: python rsi100/engine.py freeze
    - id: matrix
      run: echo "variants=$(python rsi100/engine.py matrix)" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: rsi100-frozen
        path: rsi100_output/frozen/
        retention-days: 3
        if-no-files-found: error
    permissions:
      contents: write
    outputs:
      variants: ${{ steps.matrix.outputs.variants }}
  final:
    needs:
    - freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./.github/actions/liquid-runtime
      with:
        model-assets: 'true'
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: rsi100-frozen
        path: .
    - name: Compare original and frozen hybrid on unopened final tasks
      env:
        VARIANT: ${{ matrix.variant }}
        SHARD: ${{ matrix.shard }}
      run: python rsi100/engine.py final --variant "$VARIANT" --shard "$SHARD"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: rsi100-final-${{ matrix.variant }}-${{ matrix.shard }}
        path: rsi100_output/final-${{ matrix.variant }}-${{ matrix.shard }}/
        retention-days: 3
        if-no-files-found: warn
      if: always()
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        variant: ${{ fromJSON(needs.freeze.outputs.variants) }}
        shard:
        - 0
        - 1
  report:
    needs:
    - final
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./.github/actions/liquid-runtime
      with:
        model-assets: 'false'
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: rsi100-*
        merge-multiple: true
        path: .
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: rsi100-frozen
        path: .
    - name: Verify all 100 decisions and complete final partitions
      run: python rsi100/engine.py report
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: rsi100-report
        path: rsi100_output/report/
        retention-days: 3
        if-no-files-found: error
    - run: cat RSI100_REPORT.md >> "$GITHUB_STEP_SUMMARY"
  save:
    needs:
    - report
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: codex/liquid-sense-rsi100-20261104
        fetch-depth: 0
    - name: Check immutable source and checkpoint owner
      run: python rsi100/publish.py guard
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: rsi100-report
        path: .
    - name: Save completed results and stop
      run: python rsi100/publish.py 'complete 100 rounds, final report and stop'
    permissions:
      contents: write
