name: Liquid Sense actual APK install033
on:
  push:
    branches: [codex/liquid-sense-install-033-20261115]
    paths: [android_install033/ci_request.json]
permissions:
  contents: read
concurrency:
  group: liquid-install033
  cancel-in-progress: false
jobs:
  android-install:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '4'
      LS_CPU_THREADS: '4'
      PYTHONUNBUFFERED: '1'
      ANDROID_AVD_HOME: /home/runner/.android/avd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            android_install033
            android_ui032/apk_archive
            android_ui031/apk_archive
            android_epochs030/apk_archive
            android_epochs030/patch_archive
            tooluse022/apk_archive
      - name: Restore exact pinned public upstream bytes
        run: python android_install033/portable_restore.py --download-upstream
      - name: Install emulator on standard public runner
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'emulator' 'platform-tools' 'system-images;android-35;google_apis;x86_64'
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name liquid033 --package 'system-images;android-35;google_apis;x86_64' --device pixel_6
          "$ANDROID_HOME/emulator/emulator" -avd liquid033 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 4096 -cores 2 -partition-size 8192 > "$RUNNER_TEMP/emulator033.log" 2>&1 &
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Wait for actual Android boot
        run: |
          adb wait-for-device
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Reproduce old install and install/update full clean ARM64 APK
        run: python android_install033/emulator_smoke.py
      - name: Preserve installer and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-install033-evidence
          path: |
            ${{ runner.temp }}/install033-evidence/
            ${{ runner.temp }}/emulator033.log
          retention-days: 14
